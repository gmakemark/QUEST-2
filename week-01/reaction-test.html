<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응 속도 테스트</title>
<style>
  :root {
    --bg: #f5f5f4;
    --text: #1c1917;
    --muted: #57534e;
    --card: #ffffff;
    --border: #e7e5e4;
    --idle: #2563eb;
    --wait: #dc2626;
    --go: #16a34a;
    --early: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --card: #292524;
      --border: #44403c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 16px;
  }
  h1 { margin: 0; font-size: 1.5rem; }
  .howto {
    width: 100%;
    max-width: 640px;
    margin: 0;
    padding: 12px 16px 12px 36px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .howto b { color: var(--text); }
  #pad {
    width: 100%;
    max-width: 640px;
    height: 320px;
    border: none;
    border-radius: 16px;
    color: #fff;
    font: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: background-color 0.08s;
  }
  #pad:focus-visible { outline: 4px solid var(--text); outline-offset: 3px; }
  #pad.idle  { background: var(--idle); }
  #pad.wait  { background: var(--wait); }
  #pad.go    { background: var(--go); }
  #pad.early { background: var(--early); }
  #pad.done  { background: var(--idle); }
  #big { font-size: 2.5rem; font-weight: 700; }
  #small { font-size: 1.05rem; opacity: 0.9; }
  .stats {
    width: 100%;
    max-width: 640px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat span { display: block; color: var(--muted); font-size: 0.85rem; }
  .stat strong { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .history {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .history .chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }
  #reset {
    margin-left: auto;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>반응 속도 테스트</h1>

  <ol class="howto">
    <li>아래 상자를 클릭하면 <b>빨간색</b>으로 바뀝니다. 기다리세요.</li>
    <li><b>초록색</b>으로 바뀌는 순간 최대한 빨리 클릭하세요.</li>
    <li>초록색 전에 누르면 무효입니다. 스페이스바로도 할 수 있어요.</li>
  </ol>

  <button id="pad" class="idle" type="button">
    <span id="big">시작하려면 클릭</span>
    <span id="small">빨간색이 되면 초록색을 기다리세요</span>
  </button>

  <div class="stats">
    <div class="stat"><span>최근</span><strong id="last">–</strong></div>
    <div class="stat"><span>평균</span><strong id="avg">–</strong></div>
    <div class="stat"><span>최고 기록</span><strong id="best">–</strong></div>
  </div>

  <div class="history" id="history">
    <button id="reset" type="button">기록 지우기</button>
  </div>

<script>
  const pad = document.getElementById('pad');
  const big = document.getElementById('big');
  const small = document.getElementById('small');
  const lastEl = document.getElementById('last');
  const avgEl = document.getElementById('avg');
  const bestEl = document.getElementById('best');
  const historyEl = document.getElementById('history');
  const resetBtn = document.getElementById('reset');

  let state = 'idle';   // idle | wait | go | early | done
  let timer = null;
  let goAt = 0;
  let results = [];

  function show(cls, title, sub) {
    state = cls;
    pad.className = cls;
    big.textContent = title;
    small.textContent = sub;
  }

  function startRound() {
    show('wait', '기다리세요…', '초록색이 되면 클릭!');
    const delay = 1500 + Math.random() * 3500;   // 1.5 ~ 5초
    timer = setTimeout(() => {
      show('go', '지금 클릭!', '');
      goAt = performance.now();
    }, delay);
  }

  function handlePress() {
    if (state === 'idle' || state === 'done' || state === 'early') {
      startRound();
    } else if (state === 'wait') {
      clearTimeout(timer);
      show('early', '너무 빨라요!', '초록색이 될 때까지 기다려야 해요. 클릭해서 다시 시도');
    } else if (state === 'go') {
      const ms = Math.round(performance.now() - goAt);
      results.push(ms);
      show('done', ms + ' ms', '클릭해서 다시 시도');
      render();
    }
  }

  function render() {
    historyEl.querySelectorAll('.chip').forEach(c => c.remove());
    if (results.length === 0) {
      lastEl.textContent = avgEl.textContent = bestEl.textContent = '–';
      return;
    }
    const last = results[results.length - 1];
    const avg = Math.round(results.reduce((a, b) => a + b, 0) / results.length);
    const best = Math.min(...results);
    lastEl.textContent = last + ' ms';
    avgEl.textContent = avg + ' ms';
    bestEl.textContent = best + ' ms';
    results.slice(-10).forEach(ms => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = ms + ' ms';
      historyEl.insertBefore(chip, resetBtn);
    });
  }

  // pointerdown은 click보다 먼저 발생해 측정이 더 정확함
  pad.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    handlePress();
  });

  document.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
      if (document.activeElement === resetBtn) return;
      e.preventDefault();
      handlePress();
    }
  });

  resetBtn.addEventListener('click', () => {
    clearTimeout(timer);
    results = [];
    render();
    show('idle', '시작하려면 클릭', '빨간색이 되면 초록색을 기다리세요');
  });
</script>
</body>
</html>
